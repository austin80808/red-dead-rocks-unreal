name: claude-agent

# Put the label `claude` on an issue, or write `@claude` in a comment, and Claude Code does the
# work on a GitHub runner. It runs on Austin's Claude subscription, not an API key.
# How to use it: https://github.com/VoodudeOps/Box/blob/main/docs/claude-agent.md

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    name: Claude works
    # Only the repo owner can start a run. Every other event is skipped here, before a runner starts.
    if: >-
      github.actor == 'austin80808' && github.event.sender.login == 'austin80808' &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'claude') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time for each issue or pull request. Later asks wait their turn.
    # Without `queue: max` GitHub keeps only one waiting run and drops the one before it.
    concurrency:
      group: claude-agent-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # the Claude GitHub App swaps this for its own short-lived token
      actions: read # lets Claude read CI results on a pull request
    steps:
      # Without the secret the run would fail with no word on the issue. Say why instead.
      - name: Check the token is set
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "🤖 Claude did not start: the \`CLAUDE_CODE_OAUTH_TOKEN\` repo secret is not set. Setup steps: https://github.com/VoodudeOps/Box/blob/main/docs/claude-agent.md" \
              || true
            echo "::error::The CLAUDE_CODE_OAUTH_TOKEN repo secret is not set. See https://github.com/VoodudeOps/Box/blob/main/docs/claude-agent.md"
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Made with `claude setup-token` on Austin's Claude subscription. The value lives in 1Password.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          additional_permissions: |
            actions: read
          claude_args: |
            --append-system-prompt "You are running unattended on a GitHub Actions runner with no browser and no display. Follow the CLAUDE.md in this repository if there is one. The checkout holds one commit, so git log shows no history: fetch more history or use the GitHub tools before you conclude anything from it. Run the checks that cover your change, but no browser tests. Do not change files under .github. Do not merge anything. End with a short report: what you changed, what you ran and the result, and anything you could not do."
